name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    env:
      CI: true
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Enable corepack
        run: corepack enable

      - name: Cache yarn
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.yarn/berry/cache
            node_modules/.cache
          key: yarn-${{ runner.os }}-node${{ matrix.node }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-node${{ matrix.node }}-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Type check
        run: yarn tsc:full

      - name: Lint
        run: yarn lint:all

      - name: Prettier
        run: yarn prettier:check

      - name: Package metadata
        run: yarn backstage-cli repo fix --check

      - name: Test
        run: yarn test --coverage

      - name: Build
        run: yarn build:all

      - name: Upload coverage
        if: matrix.node == 22
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore
          retention-days: 7
